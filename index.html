<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#24322d;background:#f5f7f5}*{box-sizing:border-box}body{max-width:1200px;margin:40px auto;padding:0 22px}header,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}p{color:#6a756f;margin:4px 0 22px}button,input,select,textarea{font:inherit;border:1px solid #d5ddd7;border-radius:8px;padding:9px 12px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#23664d;color:white;border-color:#23664d}button:hover{filter:brightness(.96)}.tools{justify-content:flex-start;margin:24px 0}#search{flex:1;min-width:180px}#summary{color:#547062}.table{background:white;border:1px solid #e0e6e1;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:13px;background:#f0f4f1;color:#66776c}td,th{padding:14px;border-bottom:1px solid #edf0ed;vertical-align:top}td small{display:block;color:#758079;overflow-wrap:anywhere}.task{min-width:240px;max-width:400px}.badge{display:inline-block;white-space:nowrap;border-radius:20px;background:#edf1ee;padding:2px 10px;font-size:13px}.Finished{background:#e0f1e7;color:#216746}.Running{background:#e3edf9;color:#2d5f96}.Failed{background:#fce5e5;color:#a73838}.action{color:#916c25}dialog{border:0;border-radius:14px;padding:26px;width:min(700px,95vw);max-height:90vh;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#16332566}form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;font-size:13px;gap:4px}.wide{grid-column:1/-1}textarea{min-height:80px;resize:vertical}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#message{color:#a73838}#empty{padding:32px;text-align:center;color:#758079} @media(max-width:600px){body{margin:22px auto}form .grid{grid-template-columns:1fr}td,th{padding:10px}.hide-mobile{display:none}}
</style>
<header><div><h1>计算任务</h1><p>记录进展，留好路径，明确下一步。 · 版本 3</p></div><button class="primary" id="add">＋ 新建任务</button></header>
<p style="font-size:13px">修改自动保存在当前浏览器；其他设备不会同步。清理浏览器数据前，请备份。</p><div class="tools"><button id="restore">补回初始记录</button><button id="export">备份记录</button><button id="import">恢复备份</button><input type="file" id="backup" accept="application/json,.json" hidden></div><div id="summary">正在加载…</div>
<div class="tools"><input id="search" placeholder="搜索项目、内容、目录或 Job ID" aria-label="搜索任务"><select id="status" aria-label="筛选状态"><option value="">全部状态</option><option>Submitted</option><option>Running</option><option>Finished</option><option>Failed</option><option>Cancelled</option></select><label style="flex-direction:row;align-items:center"><input type="checkbox" id="pending">仅看待处理</label></div>
<div id="message" role="status"></div><div class="table"><table><thead><tr><th>项目 / 计算内容</th><th>状态</th><th>结果 / 下一步</th><th class="hide-mobile">集群 / 路径</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>没有符合条件的任务</div></div>
<dialog id="editor"><form id="form"><h2 id="formtitle">新建任务</h2><div class="grid" id="fields"></div><div id="error" role="alert"></div><footer><button type="button" id="cancel">取消</button><button class="primary" id="save">保存</button></footer></form></dialog>
<script id="initial-data" type="application/json">[{"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19+3comp); fine-tune; one-hot encoding; one-fold; 150 epochs", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_22comp_onehot_finetune", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0324163 eV", "notes": "", "id": 15}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); fine-tune; one-hot encoding; one-fold; 150 epochs", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_onehot_finetune", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0329879 eV", "notes": "", "id": 14}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for quinary space; Nb Mo Ta W V; one-hot encoding; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_quinary_onehot_200", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0402711 eV", "notes": "", "id": 13}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19+3comp); scratch; one-hot encoding; one-fold; 200 epochs", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_22comp_onehot_200", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.033388 eV", "notes": "", "id": 12}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; one-hot encoding; one-fold; 200 epochs", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_onehot_200", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0346054 eV", "notes": "", "id": 11}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; one-hot encoding; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_onehot", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0346054 eV", "notes": "", "id": 10}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; Ta3 W2 V1; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_321", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE =  0.0388392 eV", "notes": "", "id": 9}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; Ta3 W1 V2; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_312", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.038646 eV", "notes": "", "id": 8}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; Ta2 W3 V1; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_231", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0399949 eV", "notes": "", "id": 7}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; Ta1 W3 V2; one-fold", "cluster": "HPC3-GPU", "directory": "/pub/wanjuanz/2026_10_NN_training/train_ternary_19comp_132", "job_id": "", "status": "Finished", "next_action": "Check", "finished": "2026-10-01", "result": "Valid MAE = 0.0397399 eV", "notes": "", "id": 6}, {"submitted": "", "project": "WVTa Alloy", "task": "CNN training for ternary space (19comp); scratch; Ta2 W1 V3; one-fo <script>
const $=id=>document.getElementById(id);const INITIAL_JOBS=JSON.parse($('initial-data').textContent);let jobs=[],editing=null;
const fields=[['project','项目'],['cluster','集群'],['task','计算内容','textarea'],['directory','目录'],['job_id','Job ID'],['status','状态','select'],['next_action','下一步'],['submitted','提交日期','date'],['finished','完成日期','date'],['result','结果 / 关键指标','textarea'],['notes','备注','textarea']];
for(const [key,title,type] of fields){const label=document.createElement('label');label.textContent=title;if(type==='textarea')label.className='wide';const el=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');el.name=key;if(type==='date')el.type='date';if(key==='project'||key==='task')el.required=true;if(type==='select')for(const s of ['Submitted','Running','Finished','Failed','Cancelled'])el.add(new Option(s,s));label.append(el);$('fields').append(label)}
const needsAction=j=>!!j.next_action&&j.next_action.toLowerCase()!=='none';
function text(tag,value,parent,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}
function render(){const q=$('search').value.toLowerCase();const filtered=jobs.filter(j=>(!$('status').value||j.status===$('status').value)&&(!$('pending').checked||needsAction(j))&&Object.values(j).some(v=>String(v).toLowerCase().includes(q)));$('summary').textContent=`共 ${jobs.length} 项 · 运行中 ${jobs.filter(j=>j.status==='Running').length} · 待处理 ${jobs.filter(needsAction).length}`;$('rows').replaceChildren();$('empty').hidden=filtered.length>0;for(const j of filtered){const tr=document.createElement('tr');let td=text('td','',tr,'task');text('strong',j.project,td);text('div',j.task,td);text('small',j.submitted?`提交 ${j.submitted}`:'提交日期待补充',td);td=text('td','',tr);text('span',j.status,td,'badge '+j.status);td=text('td','',tr);text('div',j.result||'—',td);if(needsAction(j))text('div','→ '+j.next_action,td,'action');td=text('td','',tr,'hide-mobile');text('div',j.cluster||'—',td);text('small',j.directory||'路径待补充',td);if(j.job_id)text('small','Job '+j.job_id,td);td=text('td','',tr);const b=text('button','编辑',td);b.onclick=()=>open(j);$('rows').append(tr)}}
function open(job){editing=job?.id??null;$('form').reset();$('error').textContent='';$('formtitle').textContent=job?'编辑任务':'新建任务';for(const [key]of fields)$('form').elements[key].value=job?.[key]??(key==='status'?'Submitted':'');if(!job){const d=new Date();$('form').elements.submitted.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}$('editor').showModal()}
$('add').onclick=()=>open(null);$('cancel').onclick=()=>$('editor').close();for(const id of ['search','status','pending'])$(id).addEventListener('input',render);
const STORE='job-tracker-v1';
function persist(next){localStorage.setItem(STORE,JSON.stringify(next));jobs=next;render()}
function valid(list){const states=['Submitted','Running','Finished','Failed','Cancelled'];if(!Array.isArray(list)||list.length>10000)throw Error('备份格式不正确');const ids=new Set();return list.map(j=>{if(!j||!Number.isSafeInteger(j.id)||j.id<1||ids.has(j.id)||!j.project||!j.task||!states.includes(j.status))throw Error('备份中的任务格式不正确');ids.add(j.id);const out={id:j.id};for(const [key]of fields){if(j[key]!=null&&typeof j[key]!=='string')throw Error('字段格式不正确');out[key]=j[key]||''}return out})}
$('form').onsubmit=e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData($('form')));data.id=editing??Math.max(0,...jobs.map(j=>j.id))+1;const next=jobs.filter(j=>j.id!==data.id);next.unshift(data);next.sort((a,b)=>b.id-a.id);persist(valid(next));$('editor').close();$('message').textContent='已保存在此浏览器'}catch(err){$('error').textContent='保存失败：'+err.message}};
$('restore').onclick=()=>{try{const seed=valid(INITIAL_JOBS);const next=[...jobs];for(const j of seed){if(!next.some(x=>x.id===j.id))next.push(j)}next.sort((a,b)=>b.id-a.id);persist(next);$('search').value='';$('status').value='';$('pending').checked=false;render();$('message').textContent='初始记录已补回，已有任务保留'}catch(e){$('message').textContent='恢复失败：'+e.message}};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='job-tracker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('backup').click();$('backup').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('备份过大');const next=valid(JSON.parse(await file.text()));if(confirm(`用备份中的 ${next.length} 条记录替换当前浏览器记录？`)){persist(next);$('message').textContent='备份已恢复'}}catch(err){$('message').textContent='恢复失败：'+err.message}finally{e.target.value=''}};
try{const seed=valid(INITIAL_JOBS);try{const stored=localStorage.getItem(STORE);jobs=stored===null?seed:valid(JSON.parse(stored));if(!jobs.length)jobs=seed}catch(e){jobs=seed;$('message').textContent='已显示初始记录；浏览器原有数据未覆盖，可点击补回初始记录保存。'}render()}catch(e){$('summary').textContent='初始记录加载失败';$('message').textContent=e.message}
</script></html>
